name: vrlizate_joystick
description: Modular dual-analog joystick, 3D VR smartphone controller, and low-latency WebSocket service for Flutter & VRlizate.
version: 0.2.0
homepage: https://github.com/Open-Neom/vrlizate_joystick
repository: https://github.com/Open-Neom/vrlizate_joystick
issue_tracker: https://github.com/Open-Neom/vrlizate_joystick/issues
